            box-shadow: 
                0 0 20px rgba(14, 165, 233, 0.6),
                0 8px 24px rgba(16, 185, 129, 0.4),
                inset 0 -2px 4px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            animation: badgePulse 2s ease-in-out infinite, badgeGlow 3s ease-in-out infinite;
        }

        .checkmark-badge::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.3) 0%, transparent 70%);
            animation: badgeRing 2.5s ease-out infinite;
        }

        .checkmark-badge::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(14, 165, 233, 0.2);
            animation: badgeRing2 3s ease-out infinite;

                0 16px 40px rgba(16, 185, 129, 0.6),
                inset 0 -2px 6px rgba(0, 0, 0, 0.3);
            transform: scale(1.15) rotateZ(5deg);
            animation: badgePulse 1s ease-in-out infinite, badgeGlow 1.5s ease-in-out infinite;

            0%, 100% {
                box-shadow: 
                    0 0 20px rgba(14, 165, 233, 0.6),
                    0 8px 24px rgba(16, 185, 129, 0.4),
                    inset 0 -2px 4px rgba(0, 0, 0, 0.2);

            50% {

                    inset 0 -2px 6px rgba(0, 0, 0, 0.2);
            }

            50% {

        function initTheme() {

                    html.classList.remove('dark');
                    html.classList.add('light');

            }
        }

            try {
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    html.classList.add('light');
                    localStorage.setItem('theme', 'light');
                } else {
                    html.classList.remove('light');
                    html.classList.add('dark');
                    localStorage.setItem('theme', 'dark');

        // --- CONTENT PROTECTION SYSTEM ---
        function initContentProtection() {
            // Disable right-click context menu
            document.addEventListener('contextmenu', (e) => {
                if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    showProtectionWarning('Hak Cipta Dilindungi', 'Konten ini dilindungi dan tidak boleh disalin tanpa izin.');
                    return false;
                }
            });

            // Disable text selection on protected elements
            document.addEventListener('selectstart', (e) => {
                if (!e.target.matches('input, textarea, .selectable')) {
                    e.preventDefault();
                    return false;
                }
            });

            // Disable copy event
            document.addEventListener('copy', (e) => {
                if (!e.target.matches('input, textarea, .selectable')) {
                    e.preventDefault();
                    showProtectionWarning('Penyalinan Dilarang', 'Konten ini dilindungi. Penyalinan teks dan gambar tidak diperbolehkan karena dianggap ilegal.');
                    return false;
                }
            });

            // Disable cut event
            document.addEventListener('cut', (e) => {
                if (!e.target.matches('input, textarea')) {
                    e.preventDefault();
                    return false;
                }
            });

            // Disable image drag
            document.addEventListener('dragstart', (e) => {
                if (e.target.tagName === 'IMG') {
                    e.preventDefault();
                    showProtectionWarning('Download Dilarang', 'Gambar dan konten tidak dapat diunduh.');
                    return false;
                }
            });

            // Prevent keyboard shortcuts for saving/printing
            document.addEventListener('keydown', (e) => {
                // Ctrl+S or Cmd+S - Save
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    return false;
                }
                // Ctrl+P or Cmd+P - Print/Screenshot
                if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
                    e.preventDefault();
                    showProtectionWarning('Screenshot Dilarang', 'Mengambil screenshot dari halaman ini tidak diperbolehkan.');
                    return false;
                }
                // Ctrl+Shift+I or F12 - Developer Tools
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                    e.preventDefault();
                    showProtectionWarning('Akses Ditolak', 'Akses ke tools pengembang tidak diperbolehkan.');
                    return false;
                }
            });

            // Disable developer tools access (basic detection)
            let devToolsOpen = false;
            const threshold = 160;
            
            setInterval(() => {
                if (window.outerHeight - window.innerHeight > threshold || window.outerWidth - window.innerWidth > threshold) {
                    if (!devToolsOpen) {
                        devToolsOpen = true;
                        console.clear();
                        showProtectionWarning('Akses Ditolak', 'Jangan coba membuka Developer Tools. Konten dilindungi oleh sistem keamanan.');
                    }
                } else {
                    devToolsOpen = false;
                }
            }, 500);

            // Disable image right-click
            document.querySelectorAll('img').forEach(img => {
                img.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    showProtectionWarning('Proteksi Konten', 'Mengunduh atau menyalin gambar tidak diperbolehkan.');
                    return false;
                });
                img.addEventListener('dragstart', (e) => {
                    e.preventDefault();
                    return false;
                });
                img.addEventListener('mousedown', (e) => {
                    if (e.button === 2) { // Right-click
                        e.preventDefault();
                    }
                });
            });

            console.log('[v0] Content protection system initialized');
        }

        function showProtectionWarning(title, message) {
            // Create warning notification
            const notification = document.createElement('div');
            notification.className = 'fixed top-4 right-4 z-50 bg-red-600/95 text-white px-6 py-4 rounded-xl shadow-2xl border border-red-400/50 animate-pulse max-w-sm';
            notification.innerHTML = `
                <div class="flex items-start gap-3">
                    <i class="fas fa-exclamation-triangle text-2xl flex-shrink-0 mt-0.5"></i>
                    <div class="flex-1">
                        <h3 class="font-bold text-base mb-1">${title}</h3>
                        <p class="text-sm font-semibold">${message}</p>
                    </div>
                    <button class="ml-2 text-white/70 hover:text-white transition-colors" onclick="this.parentElement.parentElement.remove()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;
            document.body.appendChild(notification);

            // Auto-remove after 5 seconds
            setTimeout(() => {
                if (notification.parentElement) {
                    notification.remove();
                }
            }, 5000);

            // Play warning sound (optional)
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            } catch (e) {
                // Audio context not available
            }
        }

        // Initialize content protection when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initContentProtection);
        } else {
            initContentProtection();

        // --- KATEGORISASI & ATURAN PENGURUTAN CUSTOM ---
        // Aturan: Karakter Spesial (-, _, . dll) -> Angka (0-9) -> Huruf (A-Z)
        function getCharCategory(char) {
            if (!char) return 4;
            if (/[a-zA-Z]/.test(char)) return 3; // Huruf Alfabet biasa
            if (/[0-9]/.test(char)) return 2;    // Angka
            return 1;                            // Karakter spesial (simbol, garis, dll)
        }

        function compareItems(a, b) {
            const nameA = a.name.trim();
            const nameB = b.name.trim();
            const charA = nameA.charAt(0);
            const charB = nameB.charAt(0);
            
            const catA = getCharCategory(charA);
            const catB = getCharCategory(charB);
            
            if (catA !== catB) {
                return catA - catB; // Urutkan Kategori 1 (Spesial) dulu, lalu 2 (Angka), baru 3 (Huruf)
            }
            
            // Jika kategori sama, urutkan berdasarkan alfabet/standar lokal (A-Z)
            return nameA.localeCompare(nameB, 'id', { sensitivity: 'base' });
        }

        // Tentukan grup kunci untuk setiap item (Grup A, B, atau Grup # untuk simbol/angka)
        function getGroupKey(name) {
            const firstChar = name.trim().charAt(0).toUpperCase();
            if (/[A-Z]/.test(firstChar)) {
                return firstChar;
            }
            return '#'; // Kategori simbol, garis, angka, karakter khusus dikelompokkan dalam '#'
        }

        // --- PROSES DAN RENDER DATA ---
        function renderItems() {
            // Filter data berdasarkan input pencarian
            const filtered = ITEMS_DATA.filter(item => {
                const keyword = searchQuery.toLowerCase();
                return item.name.toLowerCase().includes(keyword) || 
                       item.category.toLowerCase().includes(keyword) ||
                       item.desc.toLowerCase().includes(keyword);
            });

            // Pisahkan menjadi tipe 'game' dan 'app'
            const filteredGames = filtered.filter(item => item.type === 'game');
            const filteredApps = filtered.filter(item => item.type === 'app');

            // Urutkan masing-masing kategori sesuai kriteria custom
            filteredGames.sort(compareItems);
            filteredApps.sort(compareItems);

            // Perbarui indikator jumlah dinamis
            document.getElementById('gameCounter').innerText = `${filtered.length} Tersedia`;
            document.getElementById('gameSubCounter').innerText = `${filteredGames.length} Game`;
            document.getElementById('appSubCounter').innerText = `${filteredApps.length} Aplikasi`;

            // Proses rendering ke dalam kontainer HTML
            renderCategoryGroup(filteredGames, 'gamesContainer');
            renderCategoryGroup(filteredApps, 'appsContainer');
        }

        function renderCategoryGroup(items, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-6 text-center text-sm text-slate-300 rounded-2xl">
                        🔍 Tidak ada data yang cocok dengan pencarian Anda.
                    </div>
                `;
                return;
            }

            // Kelompokkan item berdasarkan huruf depannya
            const groups = {};
            items.forEach(item => {
                const key = getGroupKey(item.name);
                if (!groups[key]) {
                    groups[key] = [];
                }
                groups[key].push(item);
            });

            // Urutan grup: Pastikan grup '#' (angka & simbol) berada paling atas
            const sortedGroupKeys = Object.keys(groups).sort((a, b) => {
                if (a === '#') return -1;
                if (b === '#') return 1;
                return a.localeCompare(b);
            });

            // Loop untuk merender setiap grup alfabet
            sortedGroupKeys.forEach(groupKey => {
                const groupContainer = document.createElement('div');
                groupContainer.className = "space-y-3";

                // Header Grup Alfabetis
                const header = document.createElement('div');
                header.className = "flex items-center gap-2 px-1 text-sm font-extrabold tracking-wider text-white drop-shadow-md";
                header.innerHTML = `
                    <span class="bg-blue-600/60 text-white rounded-lg w-7 h-7 flex items-center justify-center border border-white/20 text-xs shadow-md">
                        ${groupKey}
                    </span>
                    <span class="opacity-80">Grup ${groupKey}</span>
                `;
                groupContainer.appendChild(header);

                // Kontainer kartu di dalam grup alfabet (Bisa bertipe view-grid / view-list)
                const cardGrid = document.createElement('div');
                cardGrid.className = currentLayout === 'grid' ? 'view-grid gap-4' : 'view-list gap-4';

                groups[groupKey].forEach(item => {
                    const card = createCardElement(item);
                    cardGrid.appendChild(card);
                });

                groupContainer.appendChild(cardGrid);
                container.appendChild(groupContainer);
            });
        }

        // Template Generator Kartu
        function createCardElement(item) {
            const card = document.createElement('div');
            
            // Kelas asimetris 'rounded-[10px_0px_10px_0px]' hanya jika layout saat ini adalah 'grid'
            const cornerClass = currentLayout === 'grid' ? 'rounded-[10px_0px_10px_0px]' : 'rounded-2xl';

            card.className = `game-card glass-card p-4 sm:p-5 shadow-2xl flex hover:scale-[1.02] hover:bg-white/55 dark:hover:bg-slate-900/65 transition-all duration-300 ${cornerClass} gap-4 w-full`;

            // Struktur Bintang Rating
            const fullStars = Math.floor(item.rating);
            const hasHalf = item.rating % 1 !== 0;
            let starsHtml = '';
            for (let i = 0; i < fullStars; i++) {
                starsHtml += '<i class="fas fa-star text-amber-400 dark:text-yellow-400"></i>';
            }
            if (hasHalf) {
                starsHtml += '<i class="fas fa-star-half-alt text-amber-400 dark:text-yellow-400"></i>';
            }
            const emptyStars = 5 - Math.ceil(item.rating);
            for (let i = 0; i < emptyStars; i++) {
                starsHtml += '<i class="far fa-star text-amber-400 dark:text-yellow-400"></i>';
            }

            // Lencana Badge jika ada
            let badgeHtml = '';
            if (item.badge) {
                badgeHtml = `
                    <span class="absolute -top-2 right-0 bg-gradient-to-r ${item.badgeColor} text-[9px] sm:text-[10px] text-white font-extrabold px-1.5 sm:px-2 py-0.5 rounded-full uppercase shadow-md">
                        ${item.badge}
                    </span>
                `;
            }

            card.innerHTML = `
                <!-- Icon Game/App -->
                <div class="img-wrapper relative flex-shrink-0">
                    <img src="${item.image}" alt="Icon ${item.name}" 
                         class="w-16 h-16 sm:w-24 sm:h-24 rounded-2xl shadow-xl object-cover border border-white/40">
                    ${badgeHtml}
                </div>
                
                <!-- Info Lengkap -->
                <div class="info-wrapper flex-1 flex flex-col justify-between h-full w-full">
                    <div>
                        <h3 class="text-sm sm:text-lg font-bold tracking-tight text-slate-900 dark:text-white mb-0.5 sm:mb-1 leading-tight">
                            ${item.name}
                        </h3>
                        
                        <!-- Rating Bintang -->
                        <div class="rating-wrapper flex items-center gap-1 sm:gap-2 text-[10px] sm:text-xs mb-2">
                            <span>${starsHtml}</span>
                            <span class="text-slate-700 dark:text-slate-300 font-medium">| ${item.category}</span>
                        </div>
                        
                        <p class="text-[11px] sm:text-xs text-slate-700 dark:text-slate-300 line-clamp-2 mb-2 sm:mb-3 leading-relaxed">
                            ${item.desc}
                        </p>
                    </div>
                    
                    <!-- Tombol Interaktif -->
                    <div class="button-group flex gap-2 w-full mt-2 sm:mt-0">
                        <button onclick="salinLink('${item.downloadLink}')" 
                                class="flex-1 py-1.5 sm:py-2.5 px-2 bg-slate-900/10 dark:bg-white/10 hover:bg-slate-900/20 dark:hover:bg-white/15 text-slate-900 dark:text-white rounded-xl text-[10px] sm:text-xs font-semibold tracking-wide transition-all duration-300 flex items-center justify-center gap-1">
                            <i class="fas fa-link text-xs"></i> <span>Salin Link</span>
                        </button>
                        <a href="${item.downloadLink}" target="_blank" 
                           class="flex-1 py-1.5 sm:py-2.5 px-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl text-[10px] sm:text-xs font-semibold tracking-wide transition-all duration-300 flex items-center justify-center gap-1 shadow-lg">
                            <i class="fas fa-cloud-download-alt text-xs"></i> <span>Download</span>
                        </a>
                    </div>
                </div>
            `;

            return card;
        }

        // --- LAYOUT SWITCHER CONTROLLER ---
        const viewGridBtn = document.getElementById('viewGrid');
        const viewListBtn = document.getElementById('viewList');

        function updateLayoutButtons() {
            if (currentLayout === 'grid') {
                viewGridBtn.classList.add('bg-white/20', 'text-white');
                viewGridBtn.classList.remove('text-slate-300');
                viewGridBtn.setAttribute('aria-pressed', 'true');
                viewListBtn.classList.remove('bg-white/20', 'text-white');
                viewListBtn.classList.add('text-slate-300');
                viewListBtn.setAttribute('aria-pressed', 'false');
            } else {
                viewListBtn.classList.add('bg-white/20', 'text-white');
                viewListBtn.classList.remove('text-slate-300');
                viewListBtn.setAttribute('aria-pressed', 'true');
                viewGridBtn.classList.remove('bg-white/20', 'text-white');
                viewGridBtn.classList.add('text-slate-300');
                viewGridBtn.setAttribute('aria-pressed', 'false');
            }
        }

        viewGridBtn.addEventListener('click', () => {
            try {
                currentLayout = 'grid';
                localStorage.setItem('layoutStyle', 'grid');
                updateLayoutButtons();
                renderItems();
            } catch (e) {
                console.warn('[v0] Layout change warning:', e.message);
            }
        });

        viewListBtn.addEventListener('click', () => {
            try {
                currentLayout = 'list';
                localStorage.setItem('layoutStyle', 'list');
                updateLayoutButtons();
                renderItems();
            } catch (e) {
                console.warn('[v0] Layout change warning:', e.message);
            }
        });

        // --- PENCARIAN CONTROLLER dengan DEBOUNCE & CLEAR BUTTON ---
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');

        function updateSearchUI() {
            if (searchQuery.trim()) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
        }

        function handleSearch(value) {
            searchQuery = value.trim();
            updateSearchUI();
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                renderItems();
            }, DEBOUNCE_DELAY);
        }

        searchInput.addEventListener('input', (e) => {
            handleSearch(e.target.value);
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            handleSearch('');
            searchInput.focus();
        });

        // Izinkan clear dengan Escape key
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && searchInput.value) {
                searchInput.value = '';
                handleSearch('');
            }
        });

        // --- LOGIKA SALIN LINK & TOAST dengan IMPROVED ERROR HANDLING ---
        function salinLink(link) {
            if (!link || typeof link !== 'string') {
                console.error('[v0] Invalid link provided:', link);
                tampilkanToast('Gagal menyalin link', 'error');
                return;
            }

            // Gunakan modern Clipboard API jika tersedia
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(link)
                    .then(() => {
                        tampilkanToast('Link berhasil disalin!', 'success');
                    })
                    .catch(err => {
                        console.error('[v0] Clipboard API error:', err);
                        // Fallback ke metode lama
                        salinLinkFallback(link);
                    });
            } else {
                // Fallback untuk browser lama
                salinLinkFallback(link);
            }
        }

        function salinLinkFallback(link) {
            try {
                const textArea = document.createElement("textarea");
                textArea.value = link;
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();

                const successful = document.execCommand('copy');
                if (successful) {
                    tampilkanToast('Link berhasil disalin!', 'success');
                } else {
                    tampilkanToast('Gagal menyalin link', 'error');
                }
                document.body.removeChild(textArea);
            } catch (err) {
                console.error('[v0] Fallback copy error:', err);
                tampilkanToast('Gagal menyalin link', 'error');
                document.body.removeChild(textArea);
            }
        }

        function tampilkanToast(message = 'Link berhasil disalin!', type = 'success') {
            const toast = document.getElementById("toast");
            if (!toast) {
                console.warn('[v0] Toast element not found');
                return;
            }

            // Update pesan toast
            const messageEl = toast.querySelector('.flex-1') || toast;
            if (messageEl) {
                messageEl.textContent = message;
            }

            // Ubah styling berdasarkan tipe
            if (type === 'error') {
                toast.querySelector('[class*="emerald"]')?.classList.add('hidden');
            }

            toast.classList.add("show");
            
            setTimeout(function(){ 
                toast.classList.remove("show"); 
            }, 2500);
        }

        // --- INITIALIZE APPLICATION ---
        async function initializeApp() {
            try {
                initTheme();
                updateLayoutButtons();
                
                // Load data from Supabase database
                const supabaseClient = window.supabase?.createClient(
                    'https://awkdqmrpqgwjhvpdffng.supabase.co',
                    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3a2RxbXJwcWd3amh2cGRmZm5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MDgwNDUsImV4cCI6MjA5NDk4NDA0NX0.Q6nUpfVi8f_P4v0C_JUnP8TrAQH4PFQ6zSPlBuFr54c'
                );

                if (supabaseClient) {
                    try {
                        // Fetch games
                        const { data: games, error: gamesError } = await supabaseClient
                            .from('games')
                            .select('*')
                            .order('created_at', { ascending: false });

                        // Fetch applications
                        const { data: apps, error: appsError } = await supabaseClient
                            .from('applications')
                            .select('*')
                            .order('created_at', { ascending: false });

                        // Convert to ITEMS_DATA format
                        const convertedGames = (games || []).map(game => ({
                            name: game.title,
                            type: 'game',
                            category: game.category || 'Game',
                            desc: game.description || 'Tidak ada deskripsi',
                            image: game.image_url,
                            downloadLink: game.download_url,
                            rating: game.rating || 0,
                            badge: null,
                            badgeColor: ''
                        }));

                        const convertedApps = (apps || []).map(app => ({
                            name: app.title,
                            type: 'app',
                            category: app.category || 'Aplikasi',
                            desc: app.description || 'Tidak ada deskripsi',
                            image: app.image_url,
                            downloadLink: app.download_url,
                            rating: app.rating || 0,
                            badge: null,
                            badgeColor: ''
                        }));

                        ITEMS_DATA = [...convertedGames, ...convertedApps];
                        console.log('[v0] Loaded', ITEMS_DATA.length, 'items from Supabase');
                    } catch (dbError) {
                        console.warn('[v0] Database load error, using fallback data:', dbError.message);
                    }
                }
                
                renderItems();
                console.log('[v0] Application initialized successfully');
            } catch (e) {
                console.error('[v0] Initialization error:', e.message);
            }
        }

        // Tunggu DOM sepenuhnya dimuat
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
    </script>
