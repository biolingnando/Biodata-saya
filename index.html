        // --- STATE MANAGEMENT ---
        let currentLayout = localStorage.getItem('layoutStyle') || 'grid';

        // Logika Mode Gelap/Terang
        const themeToggleBtn = document.getElementById('themeToggle');
        const html = document.documentElement;

        if (localStorage.getItem('theme') === 'light' || (!('theme' in localStorage) && !window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.remove('dark');
            html.classList.add('light');
        } else {
            html.classList.add('dark');
        }

        themeToggleBtn.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        // --- KATEGORISASI & ATURAN PENGURUTAN CUSTOM ---
        // Aturan: Karakter Spesial (-, _, . dll) -> Angka (0-9) -> Huruf (A-Z)
        function getCharCategory(char) {
            if (!char) return 4;
            if (/[a-zA-Z]/.test(char)) return 3; // Huruf Alfabet biasa
            if (/[0-9]/.test(char)) return 2;    // Angka
            return 1;                            // Karakter spesial (simbol, garis, dll)
        }

        function compareItems(a, b) {
            const nameA = a.name.trim();
            const nameB = b.name.trim();
            const charA = nameA.charAt(0);
            const charB = nameB.charAt(0);
            
            const catA = getCharCategory(charA);
            const catB = getCharCategory(charB);
            
            if (catA !== catB) {
                return catA - catB; // Urutkan Kategori 1 (Spesial) dulu, lalu 2 (Angka), baru 3 (Huruf)
            }
            
            // Jika kategori sama, urutkan berdasarkan alfabet/standar lokal (A-Z)
            return nameA.localeCompare(nameB, 'id', { sensitivity: 'base' });
        }

        // Tentukan grup kunci untuk setiap item (Grup A, B, atau Grup # untuk simbol/angka)
        function getGroupKey(name) {
            const firstChar = name.trim().charAt(0).toUpperCase();
            if (/[A-Z]/.test(firstChar)) {
                return firstChar;
            }
            return '#'; // Kategori simbol, garis, angka, karakter khusus dikelompokkan dalam '#'
        }

        function renderItems() {
            // Filter data berdasarkan input pencarian
            const filtered = ITEMS_DATA.filter(item => {
                const keyword = searchQuery.toLowerCase();
                return item.name.toLowerCase().includes(keyword) || 
                       item.category.toLowerCase().includes(keyword) ||
                       item.desc.toLowerCase().includes(keyword);
            });

            // Pisahkan menjadi tipe 'game' dan 'app'
            const filteredGames = filtered.filter(item => item.type === 'game');
            const filteredApps = filtered.filter(item => item.type === 'app');

            // Urutkan masing-masing kategori sesuai kriteria custom
            filteredGames.sort(compareItems);
            filteredApps.sort(compareItems);

            // Perbarui indikator jumlah dinamis
            document.getElementById('gameCounter').innerText = `${filtered.length} Tersedia`;
            document.getElementById('gameSubCounter').innerText = `${filteredGames.length} Game`;
            document.getElementById('appSubCounter').innerText = `${filteredApps.length} Aplikasi`;

        function renderCategoryGroup(items, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-6 text-center text-sm text-slate-300 rounded-2xl">
                        🔍 Tidak ada data yang cocok dengan pencarian Anda.
                    </div>
                `;
                return;
            }

            // Kelompokkan item berdasarkan huruf depannya
            const groups = {};
            items.forEach(item => {
                const key = getGroupKey(item.name);
                if (!groups[key]) {
                    groups[key] = [];
                }
                groups[key].push(item);
            });

            // Urutan grup: Pastikan grup '#' (angka & simbol) berada paling atas
            const sortedGroupKeys = Object.keys(groups).sort((a, b) => {
                if (a === '#') return -1;
                if (b === '#') return 1;
                return a.localeCompare(b);
            });

            // Loop untuk merender setiap grup alfabet
            sortedGroupKeys.forEach(groupKey => {
                const groupContainer = document.createElement('div');
                groupContainer.className = "space-y-3";

                // Header Grup Alfabetis
                const header = document.createElement('div');
                header.className = "flex items-center gap-2 px-1 text-sm font-extrabold tracking-wider text-white drop-shadow-md";
                header.innerHTML = `
                    <span class="bg-blue-600/60 text-white rounded-lg w-7 h-7 flex items-center justify-center border border-white/20 text-xs shadow-md">
                        ${groupKey}
                    </span>
                    <span class="opacity-80">Grup ${groupKey}</span>
                `;
                groupContainer.appendChild(header);

                // Kontainer kartu di dalam grup alfabet (Bisa bertipe view-grid / view-list)
                const cardGrid = document.createElement('div');
                cardGrid.className = currentLayout === 'grid' ? 'view-grid gap-4' : 'view-list gap-4';

                groups[groupKey].forEach(item => {
                    const card = createCardElement(item);
                    cardGrid.appendChild(card);
                });

                groupContainer.appendChild(cardGrid);
                container.appendChild(groupContainer);
            });
        }

        // Template Generator Kartu
        function createCardElement(item) {
            const card = document.createElement('div');
            
            // Kelas asimetris 'rounded-[10px_0px_10px_0px]' hanya jika layout saat ini adalah 'grid'
            const cornerClass = currentLayout === 'grid' ? 'rounded-[10px_0px_10px_0px]' : 'rounded-2xl';

            card.className = `game-card glass-card p-4 sm:p-5 shadow-2xl flex hover:scale-[1.02] hover:bg-white/55 dark:hover:bg-slate-900/65 transition-all duration-300 ${cornerClass} gap-4 w-full`;

            // Struktur Bintang Rating
            const fullStars = Math.floor(item.rating);
            const hasHalf = item.rating % 1 !== 0;
            let starsHtml = '';
            for (let i = 0; i < fullStars; i++) {
                starsHtml += '<i class="fas fa-star text-amber-400 dark:text-yellow-400"></i>';
            }
            if (hasHalf) {
                starsHtml += '<i class="fas fa-star-half-alt text-amber-400 dark:text-yellow-400"></i>';
            }
            const emptyStars = 5 - Math.ceil(item.rating);
            for (let i = 0; i < emptyStars; i++) {
                starsHtml += '<i class="far fa-star text-amber-400 dark:text-yellow-400"></i>';
            }

            // Lencana Badge jika ada
            let badgeHtml = '';
            if (item.badge) {
                badgeHtml = `
                    <span class="absolute -top-2 right-0 bg-gradient-to-r ${item.badgeColor} text-[9px] sm:text-[10px] text-white font-extrabold px-1.5 sm:px-2 py-0.5 rounded-full uppercase shadow-md">
                        ${item.badge}
                    </span>
                `;
            }

            card.innerHTML = `
                <!-- Icon Game/App -->
                <div class="img-wrapper relative flex-shrink-0">
                    <img src="${item.image}" alt="Icon ${item.name}" 
                         class="w-16 h-16 sm:w-24 sm:h-24 rounded-2xl shadow-xl object-cover border border-white/40">
                    ${badgeHtml}
                </div>
                
                <!-- Info Lengkap -->
                <div class="info-wrapper flex-1 flex flex-col justify-between h-full w-full">
                    <div>
                        <h3 class="text-sm sm:text-lg font-bold tracking-tight text-slate-900 dark:text-white mb-0.5 sm:mb-1 leading-tight">
                            ${item.name}
                        </h3>
                        
                        <!-- Rating Bintang -->
                        <div class="rating-wrapper flex items-center gap-1 sm:gap-2 text-[10px] sm:text-xs mb-2">
                            <span>${starsHtml}</span>
                            <span class="text-slate-700 dark:text-slate-300 font-medium">| ${item.category}</span>
                        </div>
                        
                        <p class="text-[11px] sm:text-xs text-slate-700 dark:text-slate-300 line-clamp-2 mb-2 sm:mb-3 leading-relaxed">
                            ${item.desc}
                        </p>
                    </div>
                    
                    <!-- Tombol Interaktif -->
                    <div class="button-group flex gap-2 w-full mt-2 sm:mt-0">
                        <button onclick="salinLink('${item.downloadLink}')" 
                                class="flex-1 py-1.5 sm:py-2.5 px-2 bg-slate-900/10 dark:bg-white/10 hover:bg-slate-900/20 dark:hover:bg-white/15 text-slate-900 dark:text-white rounded-xl text-[10px] sm:text-xs font-semibold transition-all duration-200 active:scale-95 flex items-center justify-center gap-1">
                            <i class="fas fa-link text-xs"></i> <span>Salin Link</span>
                        </button>
                        <a href="${item.downloadLink}" target="_blank" 
                           class="flex-1 py-1.5 sm:py-2.5 px-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl text-[10px] sm:text-xs font-semibold transition-all duration-200 active:scale-95 flex items-center justify-center gap-1">
                            <i class="fas fa-cloud-download-alt text-xs"></i> <span>Download</span>
                        </a>
                    </div>
                </div>
            `;

            return card;
        }

        // --- LAYOUT SWITCHER CONTROLLER ---
        const viewGridBtn = document.getElementById('viewGrid');
        const viewListBtn = document.getElementById('viewList');

        function updateLayoutButtons() {
            if (currentLayout === 'grid') {
                viewGridBtn.classList.add('bg-white/20', 'text-white');
                viewGridBtn.classList.remove('text-slate-300');
                viewListBtn.classList.remove('bg-white/20', 'text-white');
                viewListBtn.classList.add('text-slate-300');
            } else {
                viewListBtn.classList.add('bg-white/20', 'text-white');
                viewListBtn.classList.remove('text-slate-300');
                viewGridBtn.classList.remove('bg-white/20', 'text-white');
                viewGridBtn.classList.add('text-slate-300');
            }
        }

        viewGridBtn.addEventListener('click', () => {
            currentLayout = 'grid';
            localStorage.setItem('layoutStyle', 'grid');
            updateLayoutButtons();
            renderItems();
        });

        viewListBtn.addEventListener('click', () => {
            currentLayout = 'list';
            localStorage.setItem('layoutStyle', 'list');
            updateLayoutButtons();
            renderItems();
        });

        // --- PENCARIAN CONTROLLER ---
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderItems();
        });

        // --- LOGIKA SALIN LINK & TOAST ---
        function salinLink(link) {
            const textArea = document.createElement("textarea");
            textArea.value = link;
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    tampilkanToast();
                }
            } catch (err) {
                console.error('Gagal menyalin link: ', err);
            }
            document.body.removeChild(textArea);
        }

        function tampilkanToast() {
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            
            setTimeout(function(){ 
                toast.classList.remove("show"); 
            }, 2500);
        }

        // Mulai Render Pertama kali
        updateLayoutButtons();
        renderItems();
    </script>
</body>
</html>
