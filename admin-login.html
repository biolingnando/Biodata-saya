<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - WINORO's Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            font-size: 28px;
            color: #1a1a1a;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-button {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background-color: #fee;
            color: #c33;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            border-left: 4px solid #c33;
        }

        .success-message {
            background-color: #efe;
            color: #3c3;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            border-left: 4px solid #3c3;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Admin Dashboard</h1>
            <p>Kelola games dan aplikasi Anda</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="admin" 
                    required 
                    autocomplete="username"
                    class="selectable"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••" 
                    required 
                    autocomplete="current-password"
                    class="selectable"
                >
            </div>

            <button type="submit" class="login-button" id="loginBtn">
                <span class="loading-spinner" id="spinner"></span>
                <span id="btnText">Masuk</span>
            </button>
        </form>

        <div class="back-link">
            <a href="index.html">← Kembali ke Home</a>
        </div>
    </div>

    <script>
        // Default admin credentials (username: admin, password: admin123)
        const DEFAULT_ADMIN = {
            username: 'admin',
            password: 'admin123'
        };

        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        // Security: Check if already logged in on page load
        window.addEventListener('load', () => {
            const adminSession = localStorage.getItem('adminSession');
            const sessionExpiry = localStorage.getItem('adminSessionExpiry');
            
            if (adminSession && sessionExpiry) {
                const expiryTime = parseInt(sessionExpiry);
                // Check if session is still valid (not expired)
                if (Date.now() < expiryTime) {
                    console.log('[v0] Valid admin session found, redirecting to dashboard...');
                    window.location.href = 'admin-dashboard.html';
                    return;
                } else {
                    // Session expired, clear it
                    localStorage.removeItem('adminSession');
                    localStorage.removeItem('adminSessionExpiry');
                    localStorage.removeItem('adminUsername');
                    console.log('[v0] Admin session expired');
                }
            }
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            console.log('[v0] Login attempt with username:', username);

            // Show loading state
            loginBtn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Memproses...';
            errorMessage.style.display = 'none';
            errorMessage.textContent = '';

            // Validate credentials
            if (username === DEFAULT_ADMIN.username && password === DEFAULT_ADMIN.password) {
                console.log('[v0] Admin credentials valid');
                
                // Create secure session with expiry (8 hours)
                const sessionToken = btoa(JSON.stringify({
                    username: username,
                    timestamp: Date.now(),
                    nonce: Math.random().toString(36).substr(2, 9)
                }));

                const sessionExpiry = Date.now() + (8 * 60 * 60 * 1000); // 8 hours

                // Store session data
                localStorage.setItem('adminSession', sessionToken);
                localStorage.setItem('adminSessionExpiry', sessionExpiry.toString());
                localStorage.setItem('adminUsername', username);

                console.log('[v0] Admin session created, expiry:', new Date(sessionExpiry).toISOString());

                successMessage.textContent = 'Login berhasil! Redirect ke dashboard...';
                successMessage.style.display = 'block';

                // Redirect to admin dashboard
                setTimeout(() => {
                    console.log('[v0] Redirecting to admin-dashboard.html');
                    window.location.href = 'admin-dashboard.html';
                }, 1500);
            } else {
                console.log('[v0] Invalid credentials');
                
                errorMessage.textContent = '❌ Username atau password salah! (Gunakan: admin / admin123)';
                errorMessage.style.display = 'block';
                loginBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Masuk';
                
                // Clear password field
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        // Auto logout after session expires (check every minute)
        setInterval(() => {
            const sessionExpiry = localStorage.getItem('adminSessionExpiry');
            if (sessionExpiry && Date.now() > parseInt(sessionExpiry)) {
                console.log('[v0] Admin session expired, clearing...');
                localStorage.removeItem('adminSession');
                localStorage.removeItem('adminSessionExpiry');
                localStorage.removeItem('adminUsername');
                // Optionally redirect to login page
                if (window.location.pathname.includes('admin-dashboard')) {
                    window.location.href = 'admin-login.html?session=expired';
                }
            }
        }, 60000);
    </script>
</body>
</html>
