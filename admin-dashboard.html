<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Manage Games & Apps</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #1a1a1a;
            font-size: 24px;
            font-weight: 700;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .username {
            color: #666;
            font-weight: 500;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 15px;
        }

        .tab-btn {
            background: transparent;
            border: 2px solid #e5e7eb;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .tab-content {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .tab-content.active {
            display: block;
        }

        .tab-content.active {
            display: block;
        }

        .section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            color: #1a1a1a;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .add-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 20px;
            transition: background 0.3s;
        }

        .add-btn:hover {
            background: #059669;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .item-card {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s;
        }

        .item-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .item-image {
            width: 100%;
            height: 150px;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 10px;
            background: #e5e7eb;
        }

        .item-title {
            color: #1a1a1a;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .item-desc {
            color: #666;
            font-size: 13px;
            margin-bottom: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .edit-btn, .delete-btn {
            flex: 1;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s;
        }

        .edit-btn {
            background: #3b82f6;
            color: white;
        }

        .edit-btn:hover {
            background: #2563eb;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            color: #ddd;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #1a1a1a;
            font-size: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #1a1a1a;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .save-btn, .cancel-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .save-btn {
            background: #10b981;
            color: white;
        }

        .save-btn:hover {
            background: #059669;
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #666;
        }

        .cancel-btn:hover {
            background: #d1d5db;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 2000;
            animation: slideIn 0.3s ease-out;
        }

        .notification.success {
            background: #10b981;
        }

        .notification.error {
            background: #ef4444;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .items-grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-tachometer-alt"></i> Admin Dashboard</h1>
            <div class="header-right">
                <span class="username">Hello, <strong id="username">Admin</strong></span>
                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(this, 'games')"><i class="fas fa-gamepad"></i> Games</button>
            <button class="tab-btn" onclick="switchTab(this, 'apps')"><i class="fas fa-mobile-alt"></i> Aplikasi</button>
        </div>

        <div id="games" class="tab-content active">
            <div class="section">
                <h2><i class="fas fa-gamepad"></i> Kelola Games</h2>
                <button class="add-btn" onclick="openGameModal()"><i class="fas fa-plus"></i> Tambah Game</button>
                <div id="gamesList" class="items-grid">
                    <div class="loading"><div class="spinner"></div>Memuat games...</div>
                </div>
            </div>
        </div>

        <div id="apps" class="tab-content">
            <div class="section">
                <h2><i class="fas fa-mobile-alt"></i> Kelola Aplikasi</h2>
                <button class="add-btn" onclick="openAppModal()"><i class="fas fa-plus"></i> Tambah Aplikasi</button>
                <div id="appsList" class="items-grid">
                    <div class="loading"><div class="spinner"></div>Memuat aplikasi...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="gameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="gameTitle">Tambah Game</h3>
                <button class="close-btn" onclick="closeGameModal()">&times;</button>
            </div>
            <form id="gameForm" onsubmit="saveGame(event)">
                <div class="form-group">
                    <label>Judul Game *</label>
                    <input type="text" id="gameNameInput" required>
                </div>
                <div class="form-group">
                    <label>Deskripsi *</label>
                    <textarea id="gameDescInput" required></textarea>
                </div>
                <div class="form-group">
                    <label>URL Gambar *</label>
                    <input type="url" id="gameImageInput" required>
                </div>
                <div class="form-group">
                    <label>URL Download *</label>
                    <input type="url" id="gameDownloadInput" required>
                </div>
                <div class="form-group">
                    <label>Ukuran File</label>
                    <input type="text" id="gameSizeInput" placeholder="e.g. 245 MB">
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <input type="text" id="gameCategoryInput" placeholder="e.g. Action, RPG">
                </div>
                <div class="form-group">
                    <label>Rating (0-5)</label>
                    <input type="number" id="gameRatingInput" min="0" max="5" step="0.1" value="0">
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeGameModal()">Batal</button>
                    <button type="submit" class="save-btn">Simpan Game</button>
                </div>
            </form>
        </div>
    </div>

    <div id="appModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="appTitle">Tambah Aplikasi</h3>
                <button class="close-btn" onclick="closeAppModal()">&times;</button>
            </div>
            <form id="appForm" onsubmit="saveApp(event)">
                <div class="form-group">
                    <label>Judul Aplikasi *</label>
                    <input type="text" id="appNameInput" required>
                </div>
                <div class="form-group">
                    <label>Deskripsi *</label>
                    <textarea id="appDescInput" required></textarea>
                </div>
                <div class="form-group">
                    <label>URL Gambar *</label>
                    <input type="url" id="appImageInput" required>
                </div>
                <div class="form-group">
                    <label>URL Download *</label>
                    <input type="url" id="appDownloadInput" required>
                </div>
                <div class="form-group">
                    <label>Ukuran File</label>
                    <input type="text" id="appSizeInput" placeholder="e.g. 187 MB">
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <input type="text" id="appCategoryInput" placeholder="e.g. Utility, Productivity">
                </div>
                <div class="form-group">
                    <label>Rating (0-5)</label>
                    <input type="number" id="appRatingInput" min="0" max="5" step="0.1" value="0">
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeAppModal()">Batal</button>
                    <button type="submit" class="save-btn">Simpan Aplikasi</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function verifyAdminSession() {
            const adminSession = localStorage.getItem('adminSession');
            const sessionExpiry = localStorage.getItem('adminSessionExpiry');
            
            if (!adminSession || !sessionExpiry) {
                window.location.href = '/AdminLogin';
                return false;
            }

            if (Date.now() > parseInt(sessionExpiry)) {
                localStorage.removeItem('adminSession');
                localStorage.removeItem('adminSessionExpiry');
                localStorage.removeItem('adminUsername');
                window.location.href = '/AdminLogin?error=expired';
                return false;
            }

            return true;
        }

        if (!verifyAdminSession()) {
            throw new Error('Unauthorized');
        }

        const SUPABASE_URL = 'https://awkdqmrpqgwjhvpdffng.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3a2RxbXJwcWd3amh2cGRmZm5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MDgwNDUsImV4cCI6MjA5NDk4NDA0NX0.Q6nUpfVi8f_P4v0C_JUnP8TrAQH4PFQ6zSPlBuFr54c';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let editingGameId = null;
        let editingAppId = null;

        window.addEventListener('load', () => {
            document.getElementById('username').textContent = localStorage.getItem('adminUsername') || 'Admin';
            loadGames();
            setupAutoLogout();
        });

        function switchTab(button, tab) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            // Show selected tab
            const tabElement = document.getElementById(tab);
            if (tabElement) {
                tabElement.classList.add('active');
            }
            
            // Mark button as active
            if (button) {
                button.classList.add('active');
            }

            // Load data for the tab
            if (tab === 'apps') {
                loadApps();
            } else if (tab === 'games') {
                loadGames();
            }

            console.log('[v0] Switched to tab:', tab);
        }

        async function loadGames() {
            const gamesList = document.getElementById('gamesList');
            gamesList.innerHTML = '<div class="loading"><div class="spinner"></div>Memuat games...</div>';

            try {
                const { data, error } = await supabase.from('games').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                if (!data || data.length === 0) {
                    gamesList.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>Belum ada games</p></div>';
                    return;
                }

                gamesList.innerHTML = data.map(game => `
                    <div class="item-card">
                        <img src="${game.image_url}" class="item-image" onerror="this.src='https://via.placeholder.com/250x150?text=Game'">
                        <div class="item-title">${game.title}</div>
                        <div class="item-desc">${game.description}</div>
                        <div style="font-size: 12px; color: #999;">Size: ${game.file_size || 'N/A'}</div>
                        <div class="item-actions">
                            <button class="edit-btn" onclick="editGame(${game.id})"><i class="fas fa-edit"></i> Edit</button>
                            <button class="delete-btn" onclick="deleteGame(${game.id})"><i class="fas fa-trash"></i> Hapus</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('[v0] Error:', error);
                gamesList.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation"></i><p>Error loading games</p></div>';
            }
        }

        async function loadApps() {
            const appsList = document.getElementById('appsList');
            appsList.innerHTML = '<div class="loading"><div class="spinner"></div>Memuat aplikasi...</div>';

            try {
                const { data, error } = await supabase.from('applications').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                if (!data || data.length === 0) {
                    appsList.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>Belum ada aplikasi</p></div>';
                    return;
                }

                appsList.innerHTML = data.map(app => `
                    <div class="item-card">
                        <img src="${app.image_url}" class="item-image" onerror="this.src='https://via.placeholder.com/250x150?text=App'">
                        <div class="item-title">${app.title}</div>
                        <div class="item-desc">${app.description}</div>
                        <div style="font-size: 12px; color: #999;">Size: ${app.file_size || 'N/A'}</div>
                        <div class="item-actions">
                            <button class="edit-btn" onclick="editApp(${app.id})"><i class="fas fa-edit"></i> Edit</button>
                            <button class="delete-btn" onclick="deleteApp(${app.id})"><i class="fas fa-trash"></i> Hapus</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('[v0] Error:', error);
                appsList.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation"></i><p>Error loading apps</p></div>';
            }
        }

        function openGameModal() {
            editingGameId = null;
            document.getElementById('gameTitle').textContent = 'Tambah Game Baru';
            document.getElementById('gameForm').reset();
            document.getElementById('gameModal').classList.add('active');
        }

        function closeGameModal() {
            document.getElementById('gameModal').classList.remove('active');
        }

        async function editGame(id) {
            try {
                const { data, error } = await supabase.from('games').select('*').eq('id', id).single();
                if (error) throw error;

                editingGameId = id;
                document.getElementById('gameTitle').textContent = 'Edit Game';
                document.getElementById('gameNameInput').value = data.title;
                document.getElementById('gameDescInput').value = data.description;
                document.getElementById('gameImageInput').value = data.image_url;
                document.getElementById('gameDownloadInput').value = data.download_url;
                document.getElementById('gameSizeInput').value = data.file_size || '';
                document.getElementById('gameCategoryInput').value = data.category || '';
                document.getElementById('gameRatingInput').value = data.rating || 0;
                document.getElementById('gameModal').classList.add('active');
            } catch (error) {
                showNotification('Error loading game data', 'error');
            }
        }

        async function saveGame(e) {
            e.preventDefault();

            const gameData = {
                title: document.getElementById('gameNameInput').value,
                description: document.getElementById('gameDescInput').value,
                image_url: document.getElementById('gameImageInput').value,
                download_url: document.getElementById('gameDownloadInput').value,
                file_size: document.getElementById('gameSizeInput').value,
                category: document.getElementById('gameCategoryInput').value,
                rating: parseFloat(document.getElementById('gameRatingInput').value) || 0
            };

            try {
                if (editingGameId) {
                    const { error } = await supabase.from('games').update(gameData).eq('id', editingGameId);
                    if (error) throw error;
                    showNotification('Game updated successfully', 'success');
                } else {
                    const { error } = await supabase.from('games').insert([gameData]);
                    if (error) throw error;
                    showNotification('Game added successfully', 'success');
                }
                closeGameModal();
                loadGames();
            } catch (error) {
                showNotification('Error: ' + error.message, 'error');
            }
        }

        async function deleteGame(id) {
            if (!confirm('Delete this game?')) return;

            try {
                const { error } = await supabase.from('games').delete().eq('id', id);
                if (error) throw error;
                showNotification('Game deleted', 'success');
                loadGames();
            } catch (error) {
                showNotification('Error deleting game', 'error');
            }
        }

        function openAppModal() {
            editingAppId = null;
            document.getElementById('appTitle').textContent = 'Tambah Aplikasi Baru';
            document.getElementById('appForm').reset();
            document.getElementById('appModal').classList.add('active');
        }

        function closeAppModal() {
            document.getElementById('appModal').classList.remove('active');
        }

        async function editApp(id) {
            try {
                const { data, error } = await supabase.from('applications').select('*').eq('id', id).single();
                if (error) throw error;

                editingAppId = id;
                document.getElementById('appTitle').textContent = 'Edit Aplikasi';
                document.getElementById('appNameInput').value = data.title;
                document.getElementById('appDescInput').value = data.description;
                document.getElementById('appImageInput').value = data.image_url;
                document.getElementById('appDownloadInput').value = data.download_url;
                document.getElementById('appSizeInput').value = data.file_size || '';
                document.getElementById('appCategoryInput').value = data.category || '';
                document.getElementById('appRatingInput').value = data.rating || 0;
                document.getElementById('appModal').classList.add('active');
            } catch (error) {
                showNotification('Error loading app data', 'error');
            }
        }

        async function saveApp(e) {
            e.preventDefault();

            const appData = {
                title: document.getElementById('appNameInput').value,
                description: document.getElementById('appDescInput').value,
                image_url: document.getElementById('appImageInput').value,
                download_url: document.getElementById('appDownloadInput').value,
                file_size: document.getElementById('appSizeInput').value,
                category: document.getElementById('appCategoryInput').value,
                rating: parseFloat(document.getElementById('appRatingInput').value) || 0
            };

            try {
                if (editingAppId) {
                    const { error } = await supabase.from('applications').update(appData).eq('id', editingAppId);
                    if (error) throw error;
                    showNotification('App updated successfully', 'success');
                } else {
                    const { error } = await supabase.from('applications').insert([appData]);
                    if (error) throw error;
                    showNotification('App added successfully', 'success');
                }
                closeAppModal();
                loadApps();
            } catch (error) {
                showNotification('Error: ' + error.message, 'error');
            }
        }

        async function deleteApp(id) {
            if (!confirm('Delete this app?')) return;

            try {
                const { error } = await supabase.from('applications').delete().eq('id', id);
                if (error) throw error;
                showNotification('App deleted', 'success');
                loadApps();
            } catch (error) {
                showNotification('Error deleting app', 'error');
            }
        }

        function logout() {
            if (confirm('Logout?')) {
                localStorage.removeItem('adminSession');
                localStorage.removeItem('adminSessionExpiry');
                localStorage.removeItem('adminUsername');
                window.location.href = '/AdminLogin';
            }
        }

        function setupAutoLogout() {
            setInterval(() => {
                const expiry = localStorage.getItem('adminSessionExpiry');
                if (expiry && Date.now() > parseInt(expiry)) {
                    window.location.href = '/AdminLogin?error=expired';
                }
            }, 60000);
        }

        function showNotification(message, type) {
            const notif = document.createElement('div');
            notif.className = `notification ${type}`;
            notif.textContent = message;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeGameModal();
                closeAppModal();
            }
        });
    </script>
</body>
</html>
